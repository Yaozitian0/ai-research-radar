name: Daily AI Research Radar

on:
  schedule:
    # 01:00 UTC daily = 09:00 Beijing time (UTC+8). GitHub Actions cron does
    # not support a timezone field, so the UTC slot encodes the Beijing time.
    # The rule-based radar run takes only a few minutes, so the digest lands
    # well before 09:10 CST.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

# A late scheduled run must not overlap a manual catch-up run: both would build
# the same CST day's digest and open a duplicate set of issues (as happened on
# 2026-08-27, which produced 18 duplicates). Queue rather than cancel, so the
# scheduled run reaches the guard job below only after the manual one has
# committed its digest — and then skips.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Skip a scheduled run when today's digest already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event is ${{ github.event_name }} — manual runs always proceed."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # CST date, matching the digests/YYYY-MM-DD/ folder produced by toCstDateStr
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          if gh api "repos/${{ github.repository }}/contents/digests/$DATE" --silent 2>/dev/null; then
            echo "digests/$DATE is already committed — a manual run covered today. Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No digests/$DATE yet — proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  digest:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # Rule-based pipeline: parallel source fetches (arXiv/HF/GitHub/HN/RSS)
    # plus scoring and rendering — a few minutes, no LLM calls.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run daily research radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm start

      - name: Commit digest files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No new digest files to commit"
          else
            # CST date, matching the digests/YYYY-MM-DD/ folder produced by toCstDateStr
            DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
            git commit -m "digest: ${DATE} daily digest"
            git pull --rebase
            git push
          fi

      - name: Update web manifest
        run: pnpm manifest

      - name: Commit manifest and feed
        run: |
          git add manifest.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update manifest.json"
            git pull --rebase
            git push
          fi

      - name: Send Feishu notification
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          PAGES_URL: https://yaozitian0.github.io/ai-research-radar
        run: pnpm notify:feishu

