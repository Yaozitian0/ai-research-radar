# ai-research-radar configuration
# Changes take effect on the next workflow run. No API keys are needed here.

radar:
  # Daily picks size, clamped to 10–15 by the pipeline.
  pick_count: 12

  # arXiv categories queried for the newest submissions (last 48h window).
  arxiv_categories:
    - cs.AI
    - cs.CL
    - cs.LG
    - cs.CV
    - cs.IR

  # Research-institution RSS/Atom feeds (free, no keys). Items older than 48h
  # are dropped; a failing feed is skipped without failing the run.
  rss_feeds:
    - name: OpenAI
      url: https://openai.com/news/rss.xml
    - name: Google DeepMind
      url: https://deepmind.google/blog/rss.xml
    - name: Google AI
      url: https://blog.google/technology/ai/rss/
    - name: Microsoft Research
      url: https://www.microsoft.com/en-us/research/feed/
    - name: BAIR (Berkeley)
      url: https://bair.berkeley.edu/blog/feed.xml
    - name: Stanford AI
      url: https://ai.stanford.edu/blog/feed.xml
    - name: CMU ML
      url: https://blog.ml.cmu.edu/feed/
    - name: Hugging Face Blog
      url: https://huggingface.co/blog/feed.xml